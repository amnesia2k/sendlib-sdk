name: Controlled live integration tests

on:
  workflow_dispatch:
    inputs:
      include_batch:
        description: Run the one-recipient Pro batch test
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sendlib-live-integration
  cancel-in-progress: false

jobs:
  live:
    name: Send controlled live email
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sendlib-live

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun ci

      - name: Run explicitly enabled live tests
        run: bun run test:integration
        env:
          SENDLIB_RUN_INTEGRATION_TESTS: 'true'
          SENDLIB_RUN_BATCH_INTEGRATION_TESTS: ${{ inputs.include_batch && 'true' || 'false' }}
          SENDLIB_API_KEY: ${{ secrets.SENDLIB_API_KEY }}
          SENDLIB_TEST_RECIPIENT: ${{ secrets.SENDLIB_TEST_RECIPIENT }}
          SENDLIB_TEST_SENDER: ${{ secrets.SENDLIB_TEST_SENDER }}
          SENDLIB_TEST_TEMPLATE: ${{ secrets.SENDLIB_TEST_TEMPLATE }}
