name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish or recover
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified release
    if: github.repository == 'amnesia2k/sendlib-sdk' && (github.event_name == 'push' || startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun ci

      - name: Verify release version and changelog
        run: GITHUB_REF_NAME="$RELEASE_TAG" node ./scripts/verify-release-tag.mjs "$RELEASE_TAG"

      - name: Run complete release checks
        run: bun run prepublishOnly

      - name: Check whether this version is already published
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish immutable package with trusted publishing and provenance
        if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag latest --access public --provenance

      - name: Remove obsolete prerelease tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          next_version="$(npm view "$package_name" dist-tags.next --json 2>/dev/null || true)"
          if [ -n "$next_version" ] && [ "$next_version" != "null" ]; then
            npm dist-tag rm "$package_name" next
          fi

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
          else
            node ./scripts/extract-release-notes.mjs "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
