name: Feature request
description: Propose an improvement to the community SDK
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What SDK use case is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: upstream
    attributes:
      label: Official SendLib documentation
      description: Link upstream documentation if this depends on SendLib behavior.
