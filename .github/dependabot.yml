version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    assignees:
      - amnesia2k
    groups:
      development-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    assignees:
      - amnesia2k
